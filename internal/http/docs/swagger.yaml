basePath: /api/v1
info:
  contact: {}
  description: |-
    Codevertex ERP (HR/Ops) backend — employees, payroll, leave, attendance,
    recruitment, training, appraisals, approvals, tasks, reports. Go rebuild of the
    legacy Django ERP. OAuth via SSO, notifications via notifications-service.
  title: ERP API
  version: "1.0"
paths: {}
securityDefinitions:
  BearerAuth:
    description: 'JWT from auth-service (SSO). Format: "Bearer {token}".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
